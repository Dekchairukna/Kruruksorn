<style>
.tt-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tt-tabs a{padding:8px 14px;border-radius:999px;background:#eef2f7;color:#334155;text-decoration:none;font-weight:600;font-size:14px}
.tt-tabs a.active{background:#2563eb;color:#fff}
.tt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tt-stat{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px}
.tt-stat b{display:block;font-size:26px;line-height:1.2}
.tt-stat small{color:#64748b}
.tt-bad{color:#dc2626;font-weight:700}.tt-ok{color:#059669;font-weight:700}
.tt-filter{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.tt-filter label{display:flex;flex-direction:column;font-size:13px;gap:4px;min-width:130px}
.tt-muted{color:#64748b;font-size:13px}
.tt-grid-wrap{overflow:auto;max-width:100%}
table.tt-grid{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
.tt-grid th,.tt-grid td{border:1px solid #cbd5e1;padding:4px;vertical-align:top;font-size:12px}
.tt-grid th{background:#f1f5f9;text-align:center}
.tt-grid td.day{font-weight:700;text-align:center;vertical-align:middle;width:70px;background:#f8fafc}
.tt-grid td.lunch,.tt-grid th.lunch{width:26px;background:#fff7ed;color:#c2410c;text-align:center;vertical-align:middle;writing-mode:vertical-rl;font-size:11px}
.tt-grid td.cell{height:74px;cursor:pointer;position:relative}
.tt-grid td.cell.blk-hard{background:repeating-linear-gradient(45deg,#fee2e2,#fee2e2 6px,#fff 6px,#fff 12px)}
.tt-grid td.cell.blk-soft{background:repeating-linear-gradient(45deg,#fef9c3,#fef9c3 6px,#fff 6px,#fff 12px)}
.tt-grid td.cell.ok-target{outline:3px solid #22c55e;outline-offset:-3px}
.tt-grid td.cell.no-target{outline:3px solid #f87171;outline-offset:-3px;opacity:.75}
.tt-chip{border-radius:8px;padding:4px 6px;margin-bottom:3px;border:1px solid rgba(0,0,0,.08);line-height:1.3}
.tt-chip.bad{border:2px solid #dc2626;box-shadow:0 0 0 2px #fecaca}
.tt-chip.soft{border:2px dashed #ca8a04}
.tt-chip.sel{outline:3px solid #2563eb}
.tt-chip .lk{float:right;font-size:11px}
.tt-chip b{font-size:12px}
.tt-cell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:4px}
.tt-pick{display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:center;border:1px solid #cbd5e1;border-radius:8px;height:38px;cursor:pointer;user-select:none;font-size:12px;background:#fff}
.tt-pick.hard{background:#fecaca;border-color:#ef4444;color:#7f1d1d;font-weight:700}
.tt-pick.soft{background:#fef08a;border-color:#ca8a04;color:#713f12;font-weight:700}
.tt-bar{height:12px;border-radius:6px;background:#3b82f6;display:inline-block;vertical-align:middle}
.tt-bar.over{background:#ef4444}.tt-bar.under{background:#f59e0b}
.tt-legend span{display:inline-block;margin-right:12px;font-size:12px}
.tt-sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:4px;border:1px solid #cbd5e1}
@media print{.sidebar,.topbar,.tt-noprint,.sidebar-collapse-btn,.alert{display:none!important}.main{margin:0!important;padding:0!important}}
</style>
<div class="tt-tabs tt-noprint">
  <a href="{{ url_for('tt_home') }}">← แผนทั้งหมด</a>
  <a href="{{ url_for('tt_plan', pid=plan.id) }}" class="{{ 'active' if request.endpoint=='tt_plan' }}">ภาพรวม/จัดอัตโนมัติ</a>
  <a href="{{ url_for('tt_data', pid=plan.id) }}" class="{{ 'active' if request.endpoint=='tt_data' }}">ครูและรายวิชา</a>
  <a href="{{ url_for('tt_constraints', pid=plan.id) }}" class="{{ 'active' if request.endpoint=='tt_constraints' }}">ข้อห้าม/เวลาไม่สะดวก</a>
  <a href="{{ url_for('tt_grid', pid=plan.id) }}" class="{{ 'active' if request.endpoint=='tt_grid' }}">ตาราง/ปรับแก้</a>
  <a href="{{ url_for('tt_workload', pid=plan.id) }}" class="{{ 'active' if request.endpoint=='tt_workload' }}">ภาระงานสอน</a>
</div>
